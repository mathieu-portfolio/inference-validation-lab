[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-validation-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.9", "onnx", "onnxscript", "onnxruntime"]

[project.optional-dependencies]
test = ["pytest"]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
